<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guildhall – Dungeon Contracts</title>
<!-- Optional web font; the CSS falls back to system fonts if offline. -->
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 data-term="game">Guildhall</h1>
  <div id="gold" class="goldchip"></div>
  <button id="runbar" class="runbarbtn" data-action="tab" data-tab="missions" aria-label="Expeditions"></button>
  <button data-action="help" class="ghost" data-term="help">? Help</button>
</header>

<!-- Tab bar. data-tab must match a .view's data-view below. Becomes a bottom bar on phones. -->
<nav id="nav" aria-label="Sections">
  <button data-action="tab" data-tab="guild">🏰 <span data-term="guild">Guild</span></button>
  <button data-action="tab" data-tab="missions">🗺️ <span data-term="missions">Missions</span><b id="navBadge"></b></button>
  <button data-action="tab" data-tab="armory">🎒 <span data-term="armory">Armory</span></button>
  <button data-action="tab" data-tab="codex">📜 <span data-term="codex">Codex</span></button>
</nav>

<main>
  <!-- Each <section id> is filled by a renderX() function in js/game.js. Move a section between views to rearrange. -->
  <div class="view" data-view="guild">
    <section id="tavern"></section>
    <section id="roster"></section>
  </div>
  <div class="view" data-view="missions">
    <section id="dungeons"></section>
    <section id="missions"></section>
    <section id="reports"></section>
    <section id="log"></section>
  </div>
  <div class="view" data-view="armory">
    <section id="inventory"></section>
  </div>
  <div class="view" data-view="codex">
    <section id="lore"></section>
    <section id="dexTraits"></section>
    <section id="dexItems"></section>
    <section><h2 data-term="saveData">Save data</h2><button data-action="reset" class="ghost" data-term="resetSave">Reset save</button></section>
  </div>
</main>

<dialog id="result"><div id="resultBody"></div></dialog>
<dialog id="draft"><div id="draftBody"></div></dialog>
<dialog id="help"><div id="helpBody"></div><form method="dialog"><button data-term="close">Close</button></form></dialog>
<!-- Plain scripts (not ES modules) so index.html works by double-click. ORDER MATTERS. -->
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/game.js"></script>
</body>
</html>
